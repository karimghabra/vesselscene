[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesselscene"
version = "0.2.0"
description = "Physiological synthetic stills of conjunctival and episcleral blood vessels, with exact ground truth (splines on a flow digraph) rendered in closed form"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "opencv-python>=4.8",
    "tifffile>=2023.1",
    "networkx>=3.0",
    "scikit-image>=0.22",
    "shapely>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
vesselscene = "vesselscene.__main__:main"

[tool.setuptools.packages.find]
include = ["vesselscene*"]

[tool.setuptools.package-data]
vesselscene = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["vesselscene/tests"]
